<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

video{
    width:420px;
    height:320px;
    background:black;
    border-radius:12px;
    border:2px solid #333;
    object-fit:cover;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#00ff88;
    color:black;
    font-weight:bold;
    margin-top:20px;
}

.console{
    width:90%;
    max-width:1000px;
    height:220px;
    background:black;
    border:2px solid #333;
    border-radius:10px;
    margin:30px auto;
    overflow:auto;
    text-align:left;
    padding:10px;
    font-family:monospace;
    font-size:14px;
}

.success{
    color:#00ff88;
}

.error{
    color:#ff4444;
}

.info{
    color:#00aaff;
}

/* ─── BLOCKED SCREEN ─── */
#blocked-screen {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.95);
    z-index: 200;
    flex-direction: column;
    gap: 20px;
    text-align: center;
}

.blocked-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(224,82,82,0.15);
    border: 2px solid #ff4444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
}

.blocked-title {
    font-size: 28px;
    font-weight: bold;
    color: #ff4444;
}

.blocked-msg {
    color: #aaa;
    max-width: 400px;
    line-height: 1.6;
    font-size: 16px;
}

</style>
</head>

<body>

<!-- BLOCKED SCREEN -->
<div id="blocked-screen">
    <div class="blocked-icon">🔒</div>
    <div class="blocked-title">Dispositivo bloqueado</div>
    <div class="blocked-msg" id="blocked-msg">
        Has alcanzado el límite de 10 segundos de sesión.<br>
        El acceso a este dispositivo ha sido desactivado permanentemente.
    </div>
</div>

<h1>Realtime</h1>

<button id="startBtn">
INICIAR REALTIME
</button>

<div class="container">

<div>
<h3>Tu Cámara</h3>
<video id="localVideo" autoplay playsinline muted></video>
</div>

<div>
<h3>Procesado
    
</h3>
<video id="remoteVideo" autoplay playsinline></video>
</div>

</div>

<div class="console" id="console"></div>

<script type="module">

import {
    createDecartClient,
    models
}
from "https://esm.sh/@decartai/sdk";

const API_KEY =
"dct_la-2_IglEOouvRoucIfkcdeYkwpCXKqDvcGsaPfuCQPRXLXUzjpwLIeHPXahoYomflbil";

const startBtn =
document.getElementById("startBtn");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const consoleBox =
document.getElementById("console");

const BLOCK_KEY = 'realtime_blocked_v1';
let secondsElapsed = 0;
let timerInterval = null;
let isBlocked = false;
let hiddenClickCount = 0;

const blockedScreen = document.getElementById('blocked-screen');

// Check if device is blocked on load
if (localStorage.getItem(BLOCK_KEY) === 'true') {
    showBlocked();
    disablePage();
}

if (blockedScreen) {
    blockedScreen.addEventListener('click', () => {
        if (!isBlocked) return;
        hiddenClickCount++;
        if (hiddenClickCount >= 10) {
            localStorage.removeItem(BLOCK_KEY);
            localStorage.removeItem(BLOCK_KEY + '_time');
            location.reload();
        }
    });
}

function disablePage() {
    isBlocked = true;

    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    if (startBtn) {
        startBtn.disabled = true;
        startBtn.onclick = null;
    }

    if (window.fetch) {
        window.fetch = () => Promise.reject(new Error('Página bloqueada'));
    }
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia = () => Promise.reject(new Error('Página bloqueada'));
    }

    document.body.style.pointerEvents = 'none';
    document.body.style.userSelect = 'none';
    if (blockedScreen) {
        blockedScreen.style.pointerEvents = 'auto';
    }

    const hideSelectors = ['h1', '.container', '.console', '#startBtn'];
    hideSelectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(el => {
            if (el && el !== blockedScreen) {
                el.style.display = 'none';
            }
        });
    });
}

function showBlocked() {
    isBlocked = true;
    if (blockedScreen) {
        blockedScreen.style.display = 'flex';
    }
    if (startBtn) {
        startBtn.disabled = true;
    }
    
    // Show when it was blocked
    const blockedTime = localStorage.getItem(BLOCK_KEY + '_time');
    if (blockedTime) {
        const blockedDate = new Date(parseInt(blockedTime));
        const now = new Date();
        const diffSeconds = Math.floor((now - blockedDate) / 1000);
        const diffMinutes = Math.floor(diffSeconds / 60);
        const diffHours = Math.floor(diffMinutes / 60);
        const diffDays = Math.floor(diffHours / 24);
        
        let timeAgoText = '';
        if (diffDays > 0) {
            timeAgoText = `hace ${diffDays} día${diffDays > 1 ? 's' : ''}`;
        } else if (diffHours > 0) {
            timeAgoText = `hace ${diffHours} hora${diffHours > 1 ? 's' : ''}`;
        } else if (diffMinutes > 0) {
            timeAgoText = `hace ${diffMinutes} minuto${diffMinutes > 1 ? 's' : ''}`;
        } else {
            timeAgoText = 'hace pocos segundos';
        }
        
        const blockedMsgEl = document.getElementById('blocked-msg');
        blockedMsgEl.innerHTML = `Has alcanzado el límite de 20 segundos de sesión (${timeAgoText}).<br>El acceso a este dispositivo ha sido desactivado permanentemente.`;
    }
}

function blockDevice() {
    localStorage.setItem(BLOCK_KEY, 'true');
    localStorage.setItem(BLOCK_KEY + '_time', Date.now().toString());
    
    // Clear timer
    if (timerInterval) clearInterval(timerInterval);
    
    showBlocked();
    disablePage();
    
    // Close window after 2 seconds
    setTimeout(() => {
        window.close();
    }, 2000);
}

function log(message,type="info"){

    const div =
    document.createElement("div");

    div.className = type;

    const time =
    new Date().toLocaleTimeString();

    div.innerHTML =
    "[" + time + "] " + message;

    consoleBox.appendChild(div);

    consoleBox.scrollTop =
    consoleBox.scrollHeight;

    console.log(message);
}

window.onerror = function(
    msg,
    src,
    line,
    col,
    err
){
    log(
        "ERROR: " + msg +
        " | Línea: " + line,
        "error"
    );
};

startBtn.onclick = async ()=>{

    if (isBlocked) {
        return;
    }

    try{

        startBtn.disabled = true;
        
        // Start 20-second timer
        secondsElapsed = 0;
        timerInterval = setInterval(() => {
            secondsElapsed++;
            if (secondsElapsed >= 20) {
                blockDevice();
            }
        }, 1000);

        log("Iniciando modelo Lucy...");

        const model =
        models.realtime("lucy-2.1");

        log("Solicitando cámara...");

        const stream =
        await navigator.mediaDevices.getUserMedia({
            audio:true,
            video:{
                frameRate:model.fps,
                width:model.width,
                height:model.height
            }
        });

        localVideo.srcObject = stream;

        log("Cámara iniciada","success");

        log("Creando cliente Decart...");

        const client =
        createDecartClient({
            apiKey:API_KEY
        });

        log("Conectando realtime...");

        const realtimeClient =
        await client.realtime.connect(
            stream,
            {
                model,

                onRemoteStream:(editedStream)=>{

                    log(
                        "Stream procesado recibido",
                        "success"
                    );

                    remoteVideo.srcObject =
                    editedStream;
                }
            }
        );

        log("Conectado correctamente","success");

        log("Aplicando prompt histórico...");

        await realtimeClient.set({
            prompt: "Pon en pantalla a Juan Pablo Duarte de la República Dominicana",
            enhance: true
        });

        log("Prompt aplicado: Juan Pablo Duarte","success");

    }catch(err){

        log(
            "ERROR GENERAL: " + err,
            "error"
        );

        console.error(err);
        
        if (timerInterval) clearInterval(timerInterval);
        startBtn.disabled = false;
    }
};

log("Sistema listo");

</script>

</body>
</html>
